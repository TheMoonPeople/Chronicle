# shellcheck shell=bash
# shellcheck disable=SC2034  # every variable here is read by the driver
# Chronicle's build configurations and hooks. The Kazarov driver sources this
# file from the project root; see tools/kazarov/README.md for each variable.

KZ_PROJECT=chronicle
KZ_CONFIGS=(ps2-pal ps2-ntsc linux-x64 linux-x64-release macos-arm64 macos-arm64-release windows-x64 windows-x64-release)
KZ_DEFAULT_BUILD=linux-x64-release
KZ_DEFAULT_RUN=linux-x64-release
KZ_DEFAULT_BUILD_DARWIN=macos-arm64-release
KZ_DEFAULT_RUN_DARWIN=macos-arm64-release
KZ_DEFAULT_BUILD_WINDOWS=windows-x64-release
KZ_DEFAULT_RUN_WINDOWS=windows-x64-release
KZ_WINDOWS_HOST_SCRIPT=tools/windows/kazarov.ps1
KZ_WINDOWS_CONFIGS="windows-x64 windows-x64-release windows"
KZ_CONTAINER_CONFIGS="ps2 pal ntsc ps2-pal ps2-ntsc linux linux-x64 linux-x64-release linux-x64-debug macos macos-arm64 macos-arm64-release"
KZ_ENV_PASS=(STATEFIX STATEFIX_TRACE)

# Sets the variables for one configuration, or returns 1 for an unknown name.
kz_config() {
    case $1 in
        ps2|pal|ps2-pal) KZ_CONFIG=ps2-pal ;;
        ntsc|ps2-ntsc) KZ_CONFIG=ps2-ntsc ;;
        linux|linux-x64-release) KZ_CONFIG=linux-x64-release ;;
        linux-x64-debug|linux-x64) KZ_CONFIG=linux-x64 ;;
        macos|macos-arm64-release) KZ_CONFIG=macos-arm64-release ;;
        macos-arm64) KZ_CONFIG=macos-arm64 ;;
        windows|windows-x64-release) KZ_CONFIG=windows-x64-release ;;
        windows-x64) KZ_CONFIG=windows-x64 ;;
        *) return 1 ;;
    esac

    case $KZ_CONFIG in
        ps2-pal|ps2-ntsc)
            if [ -n "${REGION:-}" ]; then
                echo "kazarov: REGION is no longer read; use ps2-pal or ps2-ntsc" >&2
                exit 2
            fi ;;
    esac

    case $KZ_CONFIG in
        ps2-pal) kz_ps2_config PAL ;;
        ps2-ntsc) kz_ps2_config NTSC ;;
        linux-x64|linux-x64-release)
            KZ_WHERE=container
            KZ_PRESET=$KZ_CONFIG
            KZ_BUILD_TARGETS=(all)
            KZ_RUN_TARGETS=(all)
            KZ_RUN_OS=Linux
            if [ "$KZ_CONFIG" = linux-x64 ]; then
                KZ_BUILD_DIR=port/build/pc
            else
                KZ_BUILD_DIR=port/build/pc-release
            fi
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkcloud ;;
        macos-arm64|macos-arm64-release)
            KZ_WHERE=host
            KZ_HOST_OS=Darwin
            KZ_PRESET=$KZ_CONFIG
            KZ_BUILD_DIR=port/build/$KZ_CONFIG
            KZ_RUN_OS=Darwin
            KZ_RUN_EXE=$KZ_BUILD_DIR/darkcloud ;;
        windows-x64|windows-x64-release)
            KZ_WHERE=windows ;;
    esac
    return 0
}

# The PS2 configurations share everything but the region. $1 is PAL or NTSC.
kz_ps2_config() {
    local REGION=$1 r
    r=$(printf '%s' "$REGION" | tr '[:upper:]' '[:lower:]')
    export DCDECOMP_REGION=$REGION
    KZ_WHERE=container
    KZ_BUILD_DIR=ps2/build/$r
    KZ_CMAKE_ARGS=(-DPLATFORM=PS2 "-DREGION=$REGION")
    KZ_SETUP_TARGETS=(setup)
    KZ_SETUP_STAMP=ps2/asm/$r.split-stamp
    KZ_BUILD_TARGETS=(elf ctx objdiff)
    KZ_RUN_TARGETS=(iso elf)
    KZ_LOCKS=("ps2-$r")
    KZ_REQUIRE_ANY=("rom/$r/Dark Cloud ($REGION).iso" "rom/Dark Cloud ($REGION).iso" "rom/$r/extracted/iso/SCUS_971.11")
    KZ_REQUIRE_MESSAGE="kazarov: put the $REGION disc image at rom/$r/Dark Cloud ($REGION).iso (rom/Dark Cloud ($REGION).iso is also accepted)."
    KZ_RUN_ISO="ps2/build/$r/Dark Cloud ($REGION Build).iso"
}

kz_after_build() {
    case $KZ_CONFIG in
        ps2-*) python3 scripts/build/progress_report.py --region "$DCDECOMP_REGION" ;;
    esac
}

kz_after_run_build() {
    case $KZ_CONFIG in
        ps2-*)
            python3 scripts/build/verify.py -c \
                || echo "The build does not match retail; booting it anyway." >&2 ;;
    esac
}

# Extracts the PAL game data for the port, once per disc and per dcdata build.
# Without a disc image, existing port/run/data/ is used; otherwise the game asks for its data.
# The game holds the data under a shared lock while it runs, so another configuration's extraction waits for it.
kz_before_launch() {
    case $KZ_CONFIG in
        linux-*|macos-*) ;;
        *) return 0 ;;
    esac
    local run="$KZ_PROJECT_ROOT/port/run"
    local data="$run/data"
    mkdir -p "$run"
    KZ_LAUNCH_ARGS=(--data "$data" --save "$run/save")
    local iso="$KZ_PROJECT_ROOT/rom/pal/Dark Cloud (PAL).iso"
    if [ ! -e "$iso" ]; then
        iso="$KZ_PROJECT_ROOT/rom/Dark Cloud (PAL).iso"
    fi
    local lock=(--lock "$KZ_PROJECT_ROOT/.kazarov/locks/port-data.lock")
    if [ ! -e "$iso" ]; then
        if [ ! -d "$data" ]; then
            echo "kazarov: no PAL disc image found; the game will ask for its data" >&2
            cd "$run"
            return 0
        fi
        KZ_LAUNCH_PREFIX=("$KZ_ROOT/scripts/lib/kz-lock" --shared "${lock[@]}" --)
        cd "$run"
        return 0
    fi
    # Every port configuration extracts into the same data directory, so they take one lock for it.
    local cached=("$KZ_ROOT/scripts/build/kz-cached" --stamp "$data/.kazarov-data" --input "$iso" --input "$KZ_PROJECT_ROOT/$KZ_BUILD_DIR/dcdata")
    local extract=("$KZ_PROJECT_ROOT/$KZ_BUILD_DIR/dcdata" extract "$iso" "$data")
    mkdir -p .kazarov/locks
    "$KZ_ROOT/scripts/lib/kz-lock" "${lock[@]}" -- "${cached[@]}" -- "${extract[@]}"
    # Another configuration can re-extract between the two locks; the game then refuses to start.
    KZ_LAUNCH_PREFIX=("$KZ_ROOT/scripts/lib/kz-lock" --shared "${lock[@]}" -- "${cached[@]}" --then-exec -- "${extract[@]}" --)
    cd "$run"
}
