# The native PC port (docs/PC.md): builds PLATFORM=PC with clang 22 and runs
# its tests, the headless smoke runs of darkcloud among them, on Mesa's
# lavapipe software Vulkan driver. Every library comes from Ubuntu's packages.
# No game data is needed: the smoke tests build their own fixtures.
#
# The macOS job (docs/MACOS.md) runs the tests and then darkcloud on MoltenVK,
# the driver the game uses there. The Windows job (docs/WINDOWS.md) builds with
# tools/windows' scripts and runs the cases that need no Vulkan device.
name: PC port

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22 libclang1-22 python3-clang-22 cmake ninja-build glslang-tools \
            mesa-vulkan-drivers libsdl3-dev libvulkan-dev libgtest-dev nlohmann-json3-dev
          # ld.lld and llvm-readobj under their plain names.
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B port/build/pc -G Ninja -DPLATFORM=PC -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-22 -DDC_TEST_TIMEOUT=60

      - name: Build
        run: cmake --build port/build/pc

      # darkcloud is PIE and its arenas lie above 4 GiB (a debug build checks), so a pointer the game
      # truncates to 32 bits faults here. The real-data cases skip without DC_DATA.
      - name: Test
        working-directory: port/build/pc
        run: |
          llvm-readobj --file-headers darkcloud | grep -q 'Type: SharedObject'
          env -u DC_DATA ctest --output-on-failure -j4

      - name: Audit pointer truncations
        run: /usr/bin/python3 scripts/port/truncations.py --build port/build/pc --check

  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain and libraries
        run: |
          brew install llvm lld cmake ninja python glslang sdl3 vulkan-headers vulkan-loader vulkan-tools molten-vk \
            googletest nlohmann-json
          # SDL loads the Vulkan loader by name, and dyld does not search Homebrew's prefix.
          echo "SDL_VULKAN_LIBRARY=$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"

      - name: Describe the Vulkan driver
        run: |
          mkdir -p artifacts
          vulkaninfo --summary > artifacts/vulkaninfo.txt 2>&1 || true
          cat artifacts/vulkaninfo.txt

      - name: Configure
        run: cmake --preset macos-arm64 -DDC_TEST_TIMEOUT=60

      - name: Build
        run: cmake --build --preset macos-arm64

      - name: Test
        run: ctest --preset macos-arm64

      # No game data: one stand-in file gets darkcloud through renderer start-up and pipeline compilation to the
      # game's first asset load, which fails with status 4 naming the file.
      - name: Run darkcloud headless
        run: |
          mkdir -p artifacts run/data/unrelated run/save
          echo x > run/data/unrelated/file.bin
          set +e
          DC_AUDIO=off port/build/macos-arm64/darkcloud --headless --frames 3 --screenshot artifacts/shot-headless.png \
            --data run/data --save run/save > artifacts/darkcloud-headless.txt 2>&1
          status=$?
          cat artifacts/darkcloud-headless.txt
          echo "darkcloud exited $status"
          [ "$status" -eq 0 ] || [ "$status" -eq 4 ]

      - name: Run darkcloud in a window
        run: |
          set +e
          DC_AUDIO=off port/build/macos-arm64/darkcloud --frames 3 --screenshot artifacts/shot-window.png \
            --data run/data --save run/save > artifacts/darkcloud-window.txt 2>&1
          status=$?
          cat artifacts/darkcloud-window.txt
          echo "darkcloud exited $status"
          [ "$status" -eq 0 ] || [ "$status" -eq 4 ]

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/
          if-no-files-found: warn

  windows:
    name: Build and test (Windows x64)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # The runner has no GPU and may have no Vulkan loader; the tests need the loader to start.
      - name: Install the toolchain and libraries
        run: |
          ./tools/windows/acquire.ps1 -Root $env:RUNNER_TEMP -VulkanLoader
          "VULKAN_RUNTIME=$env:RUNNER_TEMP/deps/vulkan-runtime/VulkanRT-X64-1.4.363.0-Components/x64" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          ./tools/windows/configure.ps1 -Root $env:RUNNER_TEMP -BuildDirectory $env:GITHUB_WORKSPACE/port/build/windows -Tests `
            -VulkanLibrary $env:VULKAN_RUNTIME/vulkan-1.dll

      # Beside the executables, the downloaded loader is found before any in System32.
      - name: Build
        run: |
          ./tools/windows/build.ps1 -Root $env:RUNNER_TEMP -BuildDirectory $env:GITHUB_WORKSPACE/port/build/windows -Tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item $env:VULKAN_RUNTIME/vulkan-1.dll port/build/windows

      # The renderer's cases run on Linux and macOS.
      - name: Test
        run: ctest --test-dir port/build/windows --output-on-failure -j4 -E '^(GfxMisc|TexDecode)\.'
