# The macOS port (docs/MACOS.md): builds the macos-arm64 preset with Homebrew's toolchain, runs its tests,
# then runs darkcloud on MoltenVK, the driver the game uses there, headless and in a window.
name: macOS build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install the toolchain and libraries
        run: |
          brew install llvm lld cmake ninja python glslang sdl3 vulkan-headers vulkan-loader vulkan-tools molten-vk \
            googletest nlohmann-json
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          tools/ci/prebuilt-deps.sh macos-arm64
          # SDL loads the Vulkan loader by name, and dyld does not search Homebrew's prefix.
          echo "SDL_VULKAN_LIBRARY=$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"

      - name: Describe the Vulkan driver
        run: |
          mkdir -p artifacts
          vulkaninfo --summary > artifacts/vulkaninfo.txt 2>&1 || true
          cat artifacts/vulkaninfo.txt

      # The runner's paravirtual GPU takes close to a minute for some of the renderer's cases, and a Debug
      # PngImage cache case round-trips 64 MiB of PNG.
      - name: Configure
        run: cmake --preset macos-arm64 -DDC_TEST_TIMEOUT=300 -DDC_GPU_TEST_TIMEOUT=300

      - name: Build
        run: cmake --build --preset macos-arm64

      # The runner's Apple Paravirtual GPU draws black for two of Kazarov's prog0 cases that pass on Apple
      # silicon, and filters alpha across a texel edge differently from the GPUs GEqualFiltersAroundQuantized-
      # References was written against. Compiling every pipeline up front takes the paravirtual GPU up to 30 s
      # per test context, so they compile on first use.
      - name: Test
        env:
          KZ_PIPELINES_LAZY: 1
        run: >-
          ctest --preset macos-arm64
          -E '^GfxGpuMeshDc2[.](RefSphere|Prog0CullModeFollowsFlagAndMirror)$|GEqualFiltersAroundQuantizedReferences'

      # No game data: one stand-in file gets darkcloud through renderer start-up and pipeline compilation to the
      # game's first asset load, which fails with status 4 naming the file.
      - name: Run darkcloud headless
        run: |
          mkdir -p artifacts run/data/unrelated run/save
          echo x > run/data/unrelated/file.bin
          set +e
          DC_AUDIO=off port/build/macos-arm64/darkcloud --headless --frames 3 --screenshot artifacts/shot-headless.png \
            --data run/data --save run/save > artifacts/darkcloud-headless.txt 2>&1
          status=$?
          cat artifacts/darkcloud-headless.txt
          echo "darkcloud exited $status"
          [ "$status" -eq 0 ] || [ "$status" -eq 4 ]

      - name: Run darkcloud in a window
        run: |
          set +e
          DC_AUDIO=off port/build/macos-arm64/darkcloud --frames 3 --screenshot artifacts/shot-window.png \
            --data run/data --save run/save > artifacts/darkcloud-window.txt 2>&1
          status=$?
          cat artifacts/darkcloud-window.txt
          echo "darkcloud exited $status"
          [ "$status" -eq 0 ] || [ "$status" -eq 4 ]

      - name: Package the macOS build
        run: tar -czf artifacts/chronicle-macos-arm64.tar.gz -C port/build/macos-arm64 darkcloud dcdata lang glyphs

      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: chronicle-macos-arm64
          path: artifacts/chronicle-macos-arm64.tar.gz
          if-no-files-found: error

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            artifacts/vulkaninfo.txt
            artifacts/darkcloud-headless.txt
            artifacts/darkcloud-window.txt
            artifacts/shot-headless.png
            artifacts/shot-window.png
          if-no-files-found: warn
