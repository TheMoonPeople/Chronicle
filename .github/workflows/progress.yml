# decomp.dev integration.
#
# decomp.dev reads one objdiff report per release, each uploaded as an
# artifact named "<version>_report": "ntsc_report" for NTSC 1.02 and
# "pal_report" for the PAL prototype, shown as the versions ntsc and pal. One
# job per release builds its report from scratch on every push.
#
# ps2/asm/ is not committed, so the job splits it with splat first. It needs no
# disc for that: the private repository carries the three binaries for each
# region, laid out as they sit in this tree. It is checked out with a
# read-only deploy key -- the
# PRIVATE_REPO_SSH_KEY secret -- and copied in by the same
# scripts/host/overlay_private.sh a developer runs. Only report.json leaves
# the runner. In particular neither the checkout nor ps2/asm/ is ever cached: a
# pull request from a fork can restore the default branch's caches.
#
# The private repository is named only by the PRIVATE_REPOSITORY Actions
# variable (owner/name). Without it or the key -- and pull requests from forks
# get neither secrets nor, here, a reason to trust them -- the job reports
# that it was skipped rather than failing.
#
# The repository must also be registered once by hand at
# https://decomp.dev/manage/new; this workflow alone does not add it.
name: Progress report

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Progress report (${{ matrix.region }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        region: [ntsc, pal]
    env:
      HAS_PRIVATE: ${{ secrets.PRIVATE_REPO_SSH_KEY != '' && vars.PRIVATE_REPOSITORY != '' }}
      PRIVATE_REPOSITORY: ${{ vars.PRIVATE_REPOSITORY }}

    steps:
      - name: Skip without access to the private repository
        if: env.HAS_PRIVATE != 'true'
        run: |
          echo "::notice::PRIVATE_REPOSITORY or PRIVATE_REPO_SSH_KEY is not set (a pull request from a fork?); no progress report without the private repository."

      - name: Check out the repository
        if: env.HAS_PRIVATE == 'true'
        uses: actions/checkout@v7

      - name: Check out the mwccgap submodule
        if: env.HAS_PRIVATE == 'true'
        run: git submodule update --init tools/mwccgap

      - name: Check out the private repository
        if: env.HAS_PRIVATE == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          path: .private
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false

      - name: Copy in the private files
        if: env.HAS_PRIVATE == 'true'
        # The checkout goes once its files are in rom/; .dockerignore already
        # keeps it and them out of the image built next.
        run: |
          scripts/host/overlay_private.sh .private
          rm -rf .private

      - name: Build the toolchain image
        if: env.HAS_PRIVATE == 'true'
        # .dockerignore keeps rom/ and ps2/asm/ out of the image; they are
        # mounted below with the rest of the tree.
        # The Dockerfile is the only description of this toolchain, so CI uses
        # it rather than a second copy of the same steps that could drift.
        run: docker build -t dcdecomp_dev --target dev .

      - name: Split, build and generate the report
        if: env.HAS_PRIVATE == 'true'
        # There is no disc image, so `setup` checks the copied binaries
        # against the release's extracted.sha256 and splits them.
        run: |
          docker run --rm \
            -v "$PWD:/dcdecomp" -w /dcdecomp -e HOME=/tmp \
            -e REGION=${{ matrix.region }} \
            dcdecomp_dev sh -c '
              set -e
              REGION=$(printf %s "$REGION" | tr "[:lower:]" "[:upper:]")
              export REGION
              scripts/build/cmake.sh elf objdiff
              python3 scripts/build/progress_report.py --region "$REGION"
            '

      - name: Summarise
        if: env.HAS_PRIVATE == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("progress/${{ matrix.region }}/report.json"))["measures"]
          print("| Region | Code matched | Functions matched | Bytes matched |")
          print("| --- | ---: | ---: | ---: |")
          print("| %s | %.4f%% | %s / %s | %s / %s |" % (
              "${{ matrix.region }}".upper(), m["matched_code_percent"],
              m["matched_functions"], m["total_functions"],
              m["matched_code"], m["total_code"]))
          PY

      - name: Upload the progress report
        if: env.HAS_PRIVATE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.region }}_report
          path: progress/${{ matrix.region }}/report.json
          if-no-files-found: error

  discord:
    # One message covering both releases, once both reports exist.
    needs: report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    env:
      HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}

    steps:
      - name: Check out the repository
        if: env.HAS_DISCORD == 'true'
        uses: actions/checkout@v7

      - name: Download the progress reports
        if: env.HAS_DISCORD == 'true'
        id: download
        # Absent when the report jobs were skipped for want of the private
        # repository; the message is then skipped too.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: "*_report"
          path: reports

      - name: Create the Discord progress message
        if: env.HAS_DISCORD == 'true' && steps.download.outcome == 'success'
        run: |
          python3 .github/scripts/discord_progress.py \
            --ntsc reports/ntsc_report/report.json \
            --pal reports/pal_report/report.json \
            "$RUNNER_TEMP/discord-progress.json"

      - name: Send the progress message to Discord
        if: env.HAS_DISCORD == 'true' && steps.download.outcome == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/discord-progress.json" \
            "$DISCORD_WEBHOOK_URL"
