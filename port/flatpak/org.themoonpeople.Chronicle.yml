# The PC port (docs/PC.md) as a Flatpak. docs/FLATPAK.md has the commands to build, install and run
# it and to put the game's data where it looks.
id: org.themoonpeople.Chronicle
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: darkcloud
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory, which fallback-x11 needs to be usable.
  - --share=ipc
  # The GPU, for Vulkan.
  - --device=dri
  # Playback through PipeWire's or PulseAudio's PulseAudio socket.
  - --socket=pulseaudio
  # hidraw, for the 2026 Steam Controller.
  - --device=all

modules:
  # Header only, for the build alone: the network is off while chronicle configures.
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/releases/download/v3.12.0/json.tar.xz
        sha256: 42f6e95cad6ec532fd372391373363b62a14af6d771056dbfc86160e6dfff7aa

  - name: chronicle
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        CC: clang
        CXX: clang++
        LD: ld.lld
      # The SDK's default flags turn on _GLIBCXX_ASSERTIONS, -Werror=format-security and -g, none of
      # which the game's code is built with anywhere else; Release supplies the optimisation.
      cflags: ''
      cflags-override: true
      cxxflags: ''
      cxxflags-override: true
    config-opts:
      - -DPLATFORM=PC
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_PREFIX_PATH=/app
      - -DCMAKE_CXX_COMPILER=/usr/lib/sdk/llvm22/bin/clang++
      - -DDC_BUILD_TESTS=OFF
    # post-install runs in the build directory, not the source.
    post-install:
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_BUILDER_BUILDDIR}/port/flatpak/${FLATPAK_ID}.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_BUILDER_BUILDDIR}/port/flatpak/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_BUILDER_BUILDDIR}/port/flatpak/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      # chronicle-source: the CI job swaps this for a git source at the commit under test.
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build
          - ps2/build
          - port/build
          - build-dir
          - repo
          - rom
          - data
          - save
          - ps2/asm
          - .private
          - chronicle.flatpak
      # chronicle-source-end
