# The title image, as splat splits it.
name: title
sha1: 8da27dd6a4f8d2090216b17d5d64a0c142cfd6d5
options:
  platform: ps2
  compiler: MWCCPS2
  basename: title
  base_path: ../../..
  target_path: rom/ntsc/extracted/iso/TITLE.BIN
  asm_path: ps2/asm/ntsc
  src_path: ps2/src
  build_path: ps2/build/ntsc/splat/title
  ld_script_path: ps2/build/ntsc/splat/title.ld
  symbol_addrs_path: [ps2/config/ntsc/title.symbols.txt]
  undefined_syms_auto_path: ps2/build/ntsc/splat/title.undefined_syms.txt
  undefined_funcs_auto_path: ps2/build/ntsc/splat/title.undefined_funcs.txt

  # The conventions the reference assembly has always been written in.
  mips_abi_gpr: numeric
  asm_data_macro: glabel
  asm_end_label: ""
  asm_data_end_label: ""
  asm_nonmatching_label_macro: ""
  rom_address_padding: True
  create_data_pads: False
  create_bss_pads: True

  # A wrong guess makes the build non-matching, so nothing is guessed.
  rodata_string_guesser_level: 0
  data_string_guesser_level: 0
  find_file_boundaries: False

  # A constant belongs to the function that uses it and travels with
  # it; what no function claims keeps a marker of its own.
  migrate_rodata_to_functions: True
  # Every reference file has to assemble on its own: objdiff builds each as the
  # object it compares against. A constant written to a file of its own takes
  # the preamble rather than the header, so both carry macro.inc; including it
  # twice is harmless.
  generated_s_preamble: ".include \"macro.inc\""
  asm_inc_header: ".include \"macro.inc\"\n\n.set noat\n.set noreorder\n\n"
  # Every source already exists; splat reads the markers out of them
  # to decide which functions still need reference assembly.
  create_c_files: False
  # ps2/include/macro.inc is written by hand and load-bearing: its `alabel`
  # is deliberately not global, because a branch to a global label
  # becomes a relocation mwld and gas disagree about. splat's generated
  # one makes it global, so it must not overwrite this project's.
  generate_asm_macros_files: False
  do_c_func_detection: True
  # A function still in assembly gets a file of its own under
  # ps2/asm/nonmatchings; a decompiled one gets a file under ps2/asm/matchings.
  # Neither applies to a whole-file asm unit -- those are one file and nothing
  # else.
  disassemble_all: True
  make_full_disasm_for_code: True
  section_order: [".text", ".data", ".rodata", ".rdata", ".sdata", ".sbss", ".bss"]

segments:
  - name: title
    type: code
    start: 0x0
    vram: 0x1dabd00
    bss_size: 0x7c480
    subsegments:
      - {start: 0x0, type: pad, name: header}
      - {start: 0x40, type: cpp, name: title/script}
      - {start: 0x14e0, type: cpp, name: title/dispfade}
      - {start: 0x1910, type: cpp, name: title/bombeffect}
      - {start: 0x2050, type: cpp, name: title/majinbeem}
      - {start: 0x2890, type: cpp, name: title/seireiking}
      - {start: 0x34c0, type: cpp, name: title/opening}
      - {start: 0x91c0, type: cpp, name: title/op_a}
      - {start: 0xcad0, type: cpp, name: title/op_b}
      - {start: 0xfd90, type: cpp, name: title/op_c}
      - {start: 0x17f90, type: cpp, name: title/op_d}
      - {start: 0x1cc30, type: cpp, name: title/rushmovi}
      - {start: 0x1f5b0, type: cpp, name: title/title}
      - {start: 0x25db0, type: cpp, name: title/titleloop}
      - {start: 0x28100, type: cpp, name: title/logo}
      - {start: 0x28720, type: cpp, name: title/sprite}
      - {start: 0x28fc0, type: cpp, name: title/cursol}
      - {start: 0x29400, type: cpp, name: title/scfader}
      - {start: 0x29540, type: cpp, name: title/tisound}
      - {start: 0x29680, type: data, name: data, dir: title}
      - {start: 0x35dfc, type: pad, name: title_pad}
      - {start: 0x35e00, type: bss, name: bss, vram: 0x1de1afc, dir: title}
  - [0x35e00]
